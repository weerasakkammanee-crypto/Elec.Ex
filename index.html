<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANG-E EXAM — เตรียมสอบช่างอิเล็กทรอนิกส์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230e1512'/%3E%3Cpath d='M20 50h15M65 50h15M50 20v15M50 65v15' stroke='%232fdc84' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%232fdc84' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c1210;
  --bg-2:#0f1613;
  --panel:#141e19;
  --panel-2:#1b2721;
  --border:#2a3b33;
  --steel:#4a5a53;
  --steel-light:#7c8d85;
  --pcb:#2fdc84;
  --pcb-dim:#1d9e5f;
  --pcb-glow:rgba(47,220,132,0.35);
  --copper:#e0993f;
  --copper-dim:#a86c28;
  --text:#e7f2ec;
  --text-dim:#93a89d;
  --danger:#f0555b;
  --danger-dim:#5c2226;
  --success:#2fdc84;
  --radius:10px;
  --mono:'Share Tech Mono','JetBrains Mono',ui-monospace,monospace;
  --sans:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(47,220,132,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(224,153,63,0.05), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  line-height:1.55;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(47,220,132,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,220,132,0.035) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
}
#app{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:20px 16px 60px;}
a{color:var(--pcb)}
h1,h2,h3{font-family:var(--mono); letter-spacing:0.03em; margin:0 0 8px;}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0 0 10px; color:var(--text-dim)}
.brandbar{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand-badge{
  width:46px;height:46px;border-radius:10px;
  background:linear-gradient(145deg,var(--panel-2),var(--panel));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(47,220,132,0.08), 0 0 18px rgba(47,220,132,0.15);
  font-size:22px;
}
.brand-title{font-family:var(--mono); font-size:1.15rem; letter-spacing:0.06em; color:var(--pcb); text-shadow:0 0 14px var(--pcb-glow);}
.brand-sub{font-size:0.78rem; color:var(--text-dim);}
.card{
  background:linear-gradient(160deg, var(--panel), var(--panel-2));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 24px rgba(0,0,0,0.35);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--pcb), transparent);
  opacity:0.5;
}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.82rem; color:var(--text-dim); margin-bottom:5px; font-family:var(--mono);}
.field input, .field select{
  width:100%; padding:11px 12px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-2); color:var(--text);
  font-size:0.98rem; font-family:var(--sans);
}
.field input:focus, .field select:focus{outline:none; border-color:var(--pcb); box-shadow:0 0 0 3px rgba(47,220,132,0.15);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel-2); color:var(--text); cursor:pointer;
  font-family:var(--sans); font-size:0.95rem; font-weight:600;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  text-decoration:none;
}
.btn:hover{transform:translateY(-1px); border-color:var(--steel-light);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--pcb-dim), var(--pcb)); color:#062015; border-color:var(--pcb); font-weight:700;}
.btn-primary:hover{box-shadow:0 0 20px var(--pcb-glow);}
.btn-copper{background:linear-gradient(135deg, var(--copper-dim), var(--copper)); color:#241100; border-color:var(--copper); font-weight:700;}
.btn-ghost{background:transparent;}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.muted{color:var(--text-dim); font-size:0.85rem;}
.error-box{background:rgba(240,85,91,0.1); border:1px solid var(--danger-dim); color:#ffb3b6; padding:10px 12px; border-radius:8px; font-size:0.88rem; margin-bottom:12px;}
.success-box{background:rgba(47,220,132,0.08); border:1px solid var(--pcb-dim); color:var(--pcb); padding:10px 12px; border-radius:8px; font-size:0.88rem; margin-bottom:12px;}
.subject-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
.subject-card{
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:.15s;
}
.subject-card:hover{border-color:var(--pcb); box-shadow:0 0 16px rgba(47,220,132,0.12);}
.subject-icon{font-size:1.6rem; margin-bottom:6px;}
.subject-name{font-size:0.92rem; font-weight:600;}
.subject-count{font-size:0.78rem; color:var(--text-dim); font-family:var(--mono);}
.top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:0.72rem; padding:3px 10px; border-radius:999px;
  border:1px solid var(--border); color:var(--text-dim); background:var(--bg-2);
}
.pill.on{border-color:var(--pcb); color:var(--pcb);}
.progressbar{height:6px; background:var(--bg-2); border-radius:999px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border);}
.progressbar-fill{height:100%; background:linear-gradient(90deg,var(--pcb-dim),var(--pcb)); transition:width .25s;}
.q-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:var(--mono); font-size:0.78rem; color:var(--text-dim);}
.q-text{font-size:1.06rem; margin-bottom:14px; white-space:pre-wrap;}
.q-image{max-width:100%; border-radius:8px; border:1px solid var(--border); background:#fff; padding:10px; margin-bottom:14px; display:block;}
.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  display:flex; align-items:center; gap:12px; text-align:left;
  padding:13px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-2); color:var(--text); cursor:pointer; font-size:0.95rem;
  font-family:var(--sans); width:100%;
}
.choice-btn:hover{border-color:var(--steel-light);}
.choice-letter{
  font-family:var(--mono); width:26px; height:26px; border-radius:6px;
  background:var(--panel-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.8rem;
}
.choice-btn.selected{border-color:var(--copper); background:rgba(224,153,63,0.08);}
.choice-btn.selected .choice-letter{background:var(--copper); color:#241100; border-color:var(--copper);}
.choice-btn.correct{border-color:var(--pcb); background:rgba(47,220,132,0.1);}
.choice-btn.correct .choice-letter{background:var(--pcb); color:#062015;}
.choice-btn.wrong{border-color:var(--danger); background:rgba(240,85,91,0.08);}
.choice-btn.wrong .choice-letter{background:var(--danger); color:#2a0709;}
.choice-btn:disabled{cursor:default;}
.timer{font-family:var(--mono); font-size:1rem; color:var(--copper);}
.timer.low{color:var(--danger); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.score-hero{text-align:center; padding:26px 10px;}
.score-num{font-family:var(--mono); font-size:3rem; color:var(--pcb); text-shadow:0 0 26px var(--pcb-glow);}
.score-label{color:var(--text-dim); font-size:0.9rem;}
table{width:100%; border-collapse:collapse; font-size:0.88rem;}
th,td{padding:9px 8px; border-bottom:1px solid var(--border); text-align:left;}
th{font-family:var(--mono); font-size:0.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
.status-badge{font-family:var(--mono); font-size:0.7rem; padding:2px 8px; border-radius:999px; border:1px solid;}
.status-pending{color:var(--copper); border-color:var(--copper);}
.status-active{color:var(--pcb); border-color:var(--pcb);}
.status-suspended{color:var(--danger); border-color:var(--danger);}
.footer-version{
  text-align:center; margin-top:30px; font-family:var(--mono); font-size:0.72rem; color:var(--text-dim);
}
.footer-version.ok{color:var(--pcb);}
.footer-version.bad{color:var(--danger);}
.tab-row{display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border);}
.tab-btn{
  background:none; border:none; color:var(--text-dim); padding:9px 4px; cursor:pointer;
  font-family:var(--mono); font-size:0.85rem; border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--pcb); border-bottom-color:var(--pcb);}
.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--pcb);
  animation:spin 0.8s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center;}
.hidden{display:none !important;}
.link-btn{background:none;border:none;color:var(--pcb);cursor:pointer;font-family:var(--sans);font-size:0.85rem;text-decoration:underline;padding:0;}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(6,10,8,0.75); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal-box{max-width:380px; width:100%;}
::selection{background:var(--pcb); color:#062015;}
</style>
</head>

<script>/* CHANG-E EXAM — client app (app.js)
 * แอปเตรียมสอบช่างอิเล็กทรอนิกส์ หลักสูตรทหาร
 * โปรดดู README ของโปรเจกต์สำหรับขั้นตอน deploy ทั้งหมด
 */
(function () {
  'use strict';

  // ================= CONFIG =================
  // วาง URL ของ Google Apps Script Web App ที่ deploy แล้ว (ลงท้ายด้วย /exec)
  var SERVER_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  // ต้องตรงกับ SERVER_VERSION ในไฟล์ apps_script_code.gs เสมอ
  var EXPECTED_SERVER_VERSION = 'v1-initial-2026-08-17';

  var DEMO_QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
  var SUBJECTS = JSON.parse(document.getElementById('subjects-data').textContent);
  var IMG_BASE = 'assets/images/';

  var SUBJECT_TOTALS = { basic: 40, rlc: 50, number: 11, circuit: 17, math: 12 };

  // ================= STATE =================
  var state = {
    view: 'home',
    user: null,          // {username, token}
    quiz: null,          // active quiz runner state
    lastResult: null,
    history: [],
    admin: { key: '', users: [], attempts: [], tab: 'users' },
    sessionPoll: null,
    isDemo: false,
    error: '',
  };

  function loadSession() {
    try {
      var raw = localStorage.getItem('changE_session');
      if (raw) state.user = JSON.parse(raw);
    } catch (e) { /* ignore */ }
  }
  function saveSession() {
    try {
      if (state.user) localStorage.setItem('changE_session', JSON.stringify(state.user));
      else localStorage.removeItem('changE_session');
    } catch (e) { /* localStorage unavailable (private mode / restricted origin) — session just won't persist across reloads */ }
  }

  // ================= API =================
  function api(action, payload) {
    payload = payload || {};
    payload.action = action;
    if (state.user && !payload.username) { payload.username = state.user.username; payload.token = state.user.token; }
    if (!SERVER_URL || SERVER_URL.indexOf('PASTE_') === 0) {
      return Promise.resolve({ ok: false, error: 'server_not_configured' });
    }
    return fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: 'network_error' }; });
  }

  var ERROR_MESSAGES = {
    server_not_configured: 'ยังไม่ได้ตั้งค่า SERVER_URL ของแอป (ดูคำแนะนำการติดตั้ง)',
    network_error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
    invalid_credentials: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
    pending_approval: 'บัญชีนี้ยังรอการอนุมัติจากผู้ดูแลระบบ',
    suspended: 'บัญชีนี้ถูกระงับการใช้งาน',
    username_taken: 'มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาใช้ชื่ออื่น',
    username_too_short: 'ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัวอักษร',
    password_too_short: 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',
    invalid_admin_key: 'รหัสผู้ดูแลระบบไม่ถูกต้อง',
    user_not_found: 'ไม่พบผู้ใช้นี้ในระบบ',
    kicked: 'บัญชีนี้ถูกล็อกอินจากอุปกรณ์อื่น เซสชันนี้จึงถูกตัดออก',
    invalid_session: 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่',
  };
  function errMsg(code) { return ERROR_MESSAGES[code] || ('เกิดข้อผิดพลาด: ' + code); }

  // ================= HELPERS =================
  function letter(i) { return ['ก', 'ข', 'ค', 'ง'][i]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function subjectName(id) { var s = SUBJECTS.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function imgSrc(img) { return img.indexOf('data:') === 0 ? img : IMG_BASE + img; }

  // ---- Inline SVG component symbols (used for questions whose original diagram
  //      is reproduced as a schematic drawing instead of a photo) ----
  function symFixedResistor(tx) {
    return '<g transform="translate(' + tx + ',0)">' +
      '<line x1="0" y1="20" x2="16" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '<rect x="16" y="9" width="52" height="22" fill="none" stroke="#111" stroke-width="3" rx="2"/>' +
      '<line x1="68" y1="20" x2="84" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '</g>';
  }
  function symVariableResistor(tx) {
    return '<g transform="translate(' + tx + ',0)">' +
      '<line x1="0" y1="20" x2="16" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '<rect x="16" y="9" width="52" height="22" fill="none" stroke="#111" stroke-width="3" rx="2"/>' +
      '<line x1="68" y1="20" x2="84" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '<line x1="10" y1="35" x2="72" y2="3" stroke="#111" stroke-width="2.75"/>' +
      '<polygon points="72,3 63,4 67,11" fill="#111"/>' +
      '</g>';
  }
  function symLDR(tx) {
    return '<g transform="translate(' + tx + ',0)">' +
      '<circle cx="42" cy="20" r="30" fill="none" stroke="#111" stroke-width="2.25"/>' +
      '<line x1="-8" y1="20" x2="12" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '<rect x="18" y="9" width="48" height="22" fill="none" stroke="#111" stroke-width="3" rx="2"/>' +
      '<line x1="72" y1="20" x2="92" y2="20" stroke="#111" stroke-width="2.5"/>' +
      '<line x1="58" y1="-18" x2="44" y2="-2" stroke="#111" stroke-width="2.25"/>' +
      '<polygon points="44,-2 46,-9 51,-4" fill="#111"/>' +
      '<line x1="70" y1="-14" x2="56" y2="2" stroke="#111" stroke-width="2.25"/>' +
      '<polygon points="56,2 58,-5 63,0" fill="#111"/>' +
      '</g>';
  }
  var SYMBOL_DRAW = { fixed: symFixedResistor, variable: symVariableResistor, ldr: symLDR };
  var SYMBOL_LABEL = { fixed: 'ตัวต้านทานคงที่', variable: 'ปรับค่าได้', ldr: 'LDR' };

  function svgResistorSymbolSets() {
    var sets = [
      ['variable', 'fixed', 'ldr'],
      ['fixed', 'variable', 'ldr'],
      ['fixed', 'ldr', 'variable'],
      ['ldr', 'variable', 'fixed']
    ];
    var rowH = 92, colW = 150;
    var svg = '<svg viewBox="0 0 560 ' + (rowH * sets.length + 10) + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
    sets.forEach(function (set, r) {
      var y = r * rowH + 30;
      svg += '<text x="4" y="' + (y + 5) + '" font-family="monospace" font-size="16" fill="#111">ชุดที่ ' + (r + 1) + '</text>';
      set.forEach(function (kind, c) {
        var x = 90 + c * colW;
        svg += '<g transform="translate(' + x + ',' + (y - 20) + ')">' + SYMBOL_DRAW[kind](0) +
          '<text x="42" y="52" font-family="sans-serif" font-size="12" fill="#444" text-anchor="middle">' + SYMBOL_LABEL[kind] + '</text></g>';
      });
      if (r < sets.length - 1) svg += '<line x1="0" y1="' + (y + rowH - 30) + '" x2="560" y2="' + (y + rowH - 30) + '" stroke="#ddd" stroke-width="1"/>';
    });
    svg += '</svg>';
    return svg;
  }

  // Returns full HTML markup (an <img> tag or an inline SVG block) for a question image field,

  // ================= QUIZ RUNNER =================
  function startDemo() {
    state.isDemo = true;
    beginQuiz(shuffleArr(DEMO_QUESTIONS).map(function (q) { return q; }), 'practice', 'demo', null);
  }

  function startPractice(count) {
    state.error = '';
    api('getQuestions', { mode: 'practice', subject: practiceCtx.subject, count: count }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); state.view = 'home'; render(); return; }
      state.isDemo = false;
      beginQuiz(res.questions, 'practice', practiceCtx.subject, null);
    });
  }

  function startExam() {
    state.error = '';
    api('getQuestions', { mode: 'exam', count: 50 }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); state.view = 'home'; render(); return; }
      state.isDemo = false;
      beginQuiz(res.questions, 'exam', 'all', 60 * 60);
    });
  }

  function beginQuiz(questions, mode, subject, timeLimitSec) {
    state.quiz = {
      questions: questions,
      mode: mode,
      subject: subject,
      idx: 0,
      answers: {}, // id -> selectedIndex
      startedAt: new Date().toISOString(),
      timeLimitSec: timeLimitSec,
      remainingSec: timeLimitSec,
      showFeedback: mode === 'practice', // ฝึกทำ: ดูเฉลยได้ทันทีหลังเลือก
      timerHandle: null,
    };
    state.view = 'quiz';
    if (timeLimitSec) startTimer();
    if (state.user) startSessionPoll();
    render();
  }

  function startTimer() {
    if (state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
    state.quiz.timerHandle = setInterval(function () {
      if (!state.quiz) return;
      state.quiz.remainingSec--;
      if (state.quiz.remainingSec <= 0) {
        clearInterval(state.quiz.timerHandle);
        finishQuiz();
        return;
      }
      var t = document.getElementById('quiz-timer');
      if (t) {
        t.textContent = fmtTime(state.quiz.remainingSec);
        t.className = 'timer' + (state.quiz.remainingSec < 60 ? ' low' : '');
      }
    }, 1000);
  }
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function startSessionPoll() {
    stopSessionPoll();
    state.sessionPoll = setInterval(function () {
      if (!state.user) return;
      api('checkSession', {}).then(function (res) {
        if (!res.ok) { handleKicked(); }
      });
    }, 15000);
  }
  function stopSessionPoll() {
    if (state.sessionPoll) { clearInterval(state.sessionPoll); state.sessionPoll = null; }
  }
  function handleKicked() {
    stopSessionPoll();
    if (state.quiz && state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
    state.user = null; saveSession();
    state.quiz = null;
    state.error = errMsg('kicked');
    state.view = 'home';
    render();
  }

  function viewQuiz() {
    var qz = state.quiz;
    var q = qz.questions[qz.idx];
    var total = qz.questions.length;
    var selected = qz.answers[q.id];
    var pct = Math.round((qz.idx) / total * 100);

    var out = '<div class="card">';
    out += '<div class="progressbar"><div class="progressbar-fill" style="width:' + pct + '%"></div></div>';
    out += '<div class="q-meta"><span>ข้อ ' + (qz.idx + 1) + ' / ' + total + (qz.subject && qz.subject !== 'all' && qz.subject !== 'demo' ? ' · ' + esc(subjectName(qz.subject)) : '') + '</span>';
    if (qz.timeLimitSec) out += '<span id="quiz-timer" class="timer">' + fmtTime(qz.remainingSec) + '</span>';
    out += '</div>';
    out += '<div class="q-text">' + esc(q.text) + '</div>';
    out += imgHtml(q.image);
    out += '<div class="choice-list">';
    q.choices.forEach(function (c, i) {
      var cls = 'choice-btn';
      var showFeedback = qz.showFeedback && selected !== undefined;
      if (showFeedback) {
        if (i === q.answer) cls += ' correct';
        else if (i === selected) cls += ' wrong';
      } else if (selected === i) {
        cls += ' selected';
      }
      var disabled = showFeedback ? ' disabled' : '';
      out += '<button class="' + cls + '" data-action="selectChoice" data-i="' + i + '"' + disabled + '>' +
        '<span class="choice-letter">' + letter(i) + '</span><span>' + esc(c) + '</span></button>';
    });
    out += '</div>';

    out += '<div class="btn-row" style="margin-top:18px">';
    if (qz.idx > 0) out += '<button class="btn" data-action="prevQ">‹ ก่อนหน้า</button>';
    if (qz.idx < total - 1) out += '<button class="btn btn-primary" data-action="nextQ">ถัดไป ›</button>';
    else out += '<button class="btn btn-primary" data-action="finishQ">ส่งคำตอบ ✓</button>';
    out += '<button class="btn btn-ghost" data-action="abortQuiz">ออกจากแบบทดสอบ</button>';
    out += '</div></div>';
    return out;
  }

  function selectChoice(i) {
    var qz = state.quiz;
    var q = qz.questions[qz.idx];
    if (qz.showFeedback && qz.answers[q.id] !== undefined) return; // ดูเฉลยแล้ว ห้ามแก้
    qz.answers[q.id] = i;
    render();
  }

  function finishQuiz() {
    var qz = state.quiz;
    stopSessionPoll();
    if (qz.timerHandle) clearInterval(qz.timerHandle);
    var answersArr = qz.questions.map(function (q) { return { id: q.id, selected: qz.answers[q.id] === undefined ? -1 : qz.answers[q.id] }; });

    if (state.isDemo) {
      var score = 0;
      var detail = qz.questions.map(function (q) {
        var sel = qz.answers[q.id];
        var ok = sel === q.answer;
        if (ok) score++;
        return { id: q.id, text: q.text, choices: q.choices, selected: sel, correct: q.answer, isCorrect: ok, image: q.image };
      });
      state.lastResult = { score: score, total: qz.questions.length, detail: detail, mode: 'demo' };
      state.quiz = null; state.view = 'result'; render();
      return;
    }

    api('submitAttempt', { mode: qz.mode, subject: qz.subject, answers: answersArr, startedAt: qz.startedAt }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); state.view = 'home'; state.quiz = null; render(); return; }
      var detail = res.detail.map(function (d) {
        var q = qz.questions.filter(function (x) { return x.id === d.id; })[0];
        return { id: d.id, text: q.text, choices: q.choices, selected: d.selected, correct: d.correct, isCorrect: d.isCorrect, image: q.image };
      });
      state.lastResult = { score: res.score, total: res.total, detail: detail, mode: qz.mode };
      state.quiz = null; state.view = 'result'; render();
    });
  }

  function abortQuiz() {
    if (!confirm('ต้องการออกจากแบบทดสอบนี้หรือไม่? คำตอบที่ทำไว้จะไม่ถูกบันทึก')) return;
    stopSessionPoll();
    if (state.quiz && state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
    state.quiz = null;
    state.view = 'home';
    render();
  }

      out += '<button class="btn" style="padding:6px 10px;font-size:0.8rem" data-action="adminReset" data-u="' + esc(u.username) + '">🔑 รีเซ็ตรหัส</button>';
      out += '<button class="btn btn-danger" style="padding:6px 10px;font-size:0.8rem" data-action="adminDelete" data-u="' + esc(u.username) + '">🗑️ ลบ</button>';
      out += '</div></td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }
  function statusTh(s) { return { pending: '⏸️ รออนุมัติ', active: '✅ ใช้งานได้', suspended: '⛔ ถูกระงับ' }[s] || s; }

  function adminAttemptsTable() {
    var a = state.admin;
    var out = '<table><thead><tr><th>ผู้ใช้</th><th>โหมด</th><th>หมวด</th><th>คะแนน</th><th>วันที่</th><th></th></tr></thead><tbody>';
    a.attempts.forEach(function (x) {
      out += '<tr><td>' + esc(x.username) + '</td><td>' + (x.mode === 'exam' ? 'จำลองสอบ' : 'ฝึกทำ') + '</td>' +
        '<td>' + esc(x.subject) + '</td><td>' + x.score + '/' + x.total + '</td><td>' + fmtDate(x.finishedAt) + '</td>' +
        '<td><button class="btn btn-danger" style="padding:6px 10px;font-size:0.8rem" data-action="adminDeleteAttempt" data-id="' + esc(x.attemptId) + '">🗑️</button></td></tr>';
    });
    out += '</tbody></table>';
    return out;
  }

  function adminLoad() {
    var key = document.getElementById('f-adminkey').value.trim();
    state.admin.key = key;
    state.error = '';
    Promise.all([
      api('adminListUsers', { adminKey: key }),
      api('adminListAttempts', { adminKey: key })
    ]).then(function (results) {
      var u = results[0], at = results[1];
      if (!u.ok) { state.error = errMsg(u.error); state.admin.loaded = false; render(); return; }
      state.admin.users = u.users;
      state.admin.attempts = at.ok ? at.attempts : [];
      state.admin.loaded = true;
      render();
    });
  }
  function adminAction(action, extra) {
    var payload = Object.assign({ adminKey: state.admin.key }, extra);
    api(action, payload).then(function (res) {
      if (!res.ok) { alert(errMsg(res.error)); return; }
      adminLoad();
    });
  }

  // ================= EVENT BINDING =================
  function bindEvents() {
    root.querySelectorAll('[data-go]').forEach(function (el) {
      el.addEventListener('click', function () { state.error = ''; state.view = el.getAttribute('data-go'); render(); if (state.view === 'history') loadHistory(); });
    });
    root.querySelectorAll('[data-action]').forEach(function (el) {
      el.addEventListener('click', function () { handleAction(el.getAttribute('data-action'), el); });
    });
  }

  function handleAction(action, el) {
    if (action === 'startDemo') { startDemo(); return; }
    if (action === 'doLogin') { doLogin(); return; }
    if (action === 'doRegister') { doRegister(); return; }
    if (action === 'logout') { doLogout(); return; }
    if (action === 'startExam') { startExam(); return; }
    if (action === 'practiceSubject') { practiceCtx.subject = el.getAttribute('data-subject'); state.view = 'practiceSetup'; render(); return; }
    if (action === 'startPractice') { startPractice(parseInt(el.getAttribute('data-count'), 10)); return; }
    if (action === 'selectChoice') { selectChoice(parseInt(el.getAttribute('data-i'), 10)); return; }
    if (action === 'nextQ') { state.quiz.idx++; render(); return; }
    if (action === 'prevQ') { state.quiz.idx--; render(); return; }
    if (action === 'finishQ') { finishQuiz(); return; }
    if (action === 'abortQuiz') { abortQuiz(); return; }
    if (action === 'adminLoad') { adminLoad(); return; }
    if (action === 'adminTab') { state.admin.tab = el.getAttribute('data-tab'); render(); return; }
    if (action === 'adminApprove') { adminAction('adminApprove', { username: el.getAttribute('data-u') }); return; }
    if (action === 'adminSuspend') { adminAction('adminSuspend', { username: el.getAttribute('data-u') }); return; }
    if (action === 'adminDelete') {
      if (!confirm('ยืนยันลบผู้ใช้ ' + el.getAttribute('data-u') + '?')) return;
      var delHist = confirm('ต้องการลบประวัติคะแนนของผู้ใช้นี้ด้วยหรือไม่? (ตกลง = ลบด้วย, ยกเลิก = เก็บไว้)');
      adminAction('adminDeleteUser', { username: el.getAttribute('data-u'), deleteHistory: delHist });
      return;
    }
    if (action === 'adminReset') {
      var pw = prompt('ตั้งรหัสผ่านใหม่ให้ผู้ใช้ ' + el.getAttribute('data-u') + ' (อย่างน้อย 6 ตัวอักษร)');
      if (!pw) return;
      adminAction('adminResetPassword', { username: el.getAttribute('data-u'), newPassword: pw });
      return;
    }
    if (action === 'adminDeleteAttempt') {
      if (!confirm('ยืนยันลบประวัตินี้?')) return;
      adminAction('adminDeleteAttempt', { attemptId: el.getAttribute('data-id') });
      return;
    }
  }

  function doLogin() {
    var username = document.getElementById('f-username').value.trim();
    var password = document.getElementById('f-password').value;
    state.error = '';
    api('login', { username: username, password: password }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); render(); return; }
      state.user = { username: res.username, token: res.token };
      saveSession();
      state.view = 'home';
      render();
    });
  }

  function doRegister() {
    var username = document.getElementById('f-username').value.trim();
    var password = document.getElementById('f-password').value;
    var password2 = document.getElementById('f-password2').value;
    if (password !== password2) { state.error = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'; render(); return; }
    state.error = '';
    api('register', { username: username, password: password }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); render(); return; }
      state.view = 'login';
      state.error = '';
      alert('สมัครสมาชิกสำเร็จ! บัญชีของคุณรออนุมัติจากผู้ดูแลระบบ');
      render();
    });
  }

  function doLogout() {
    api('logout', {});
    stopSessionPoll();
    state.user = null;
    saveSession();
    state.view = 'home';
    render();
  }

  // ================= BOOT =================
  loadSession();
  render();
  checkVersion();
  if (state.user) startSessionPoll();
})();
</script>
</body>
</html>
